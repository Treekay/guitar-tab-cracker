[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabstitch"
version = "0.1.0"
description = "Private guitar-tab screenshot reconstruction tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tabstitch = "tabstitch.cli:main"

[tool.setuptools.package-data]
tabstitch = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
